[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzina"
version = "0.2.0"
description = "Efficient and accurate virtual screening via docking-guided binding prediction with Boltz-2"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "boltz[cuda]>=2.2.0",
    "openbabel-wheel>=3.1.1.22",
    "pdb-tools>=2.5.0",
    "triton==3.3.0",
    "meeko>=0.6.1",
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.scripts]
boltzina = "boltzina.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["boltzina*"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires GPU", "slow: slow integration test"]
